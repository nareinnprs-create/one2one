name: checks
# The gate. Runs the exact same script as the local pre-push hook, so a green
# push means a green CI. Runs on every branch + PR (not just master).
on:
  push:
  pull_request:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # Match the platforms README claims to support (Linux + macOS).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: ./scripts/check.sh
