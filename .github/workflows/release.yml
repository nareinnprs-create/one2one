name: release

# Fires when a version tag is pushed (e.g. `git tag v2.0.1 && git push --tags`).
# Jobs are independent: PyPI, GHCR, and the .deb each publish on their own, so a
# hiccup in the secondary .deb channel never blocks the PyPI/container release.
#
# Supply-chain posture (M8):
#   - Third-party actions are pinned to a commit SHA (Dependabot bumps them) so a
#     re-tagged action can't silently change what runs. See .github/dependabot.yml.
#   - Artifacts get SLSA build-provenance + a CycloneDX SBOM attestation, verifiable
#     with `gh attestation verify`.
#   - PyPI upload carries PEP 740 digital attestations automatically (Trusted
#     Publishing + gh-action-pypi-publish).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + SBOM + attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # sign provenance/SBOM attestations via Sigstore (OIDC)
      attestations: write     # write attestations to the repo's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine cyclonedx-bom
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Generate CycloneDX SBOM
        # Install the built wheel into a throwaway env and snapshot its real
        # dependency closure (one2one + rich + pyyaml + platformdirs + transitives).
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --upgrade pip
          /tmp/sbomenv/bin/pip install dist/*.whl
          mkdir -p sbom
          cyclonedx-py environment /tmp/sbomenv --of JSON -o sbom/one2one.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: "sbom/one2one.cdx.json"
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

  pypi-publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # One-time owner setup: on PyPI, add this repo as a Trusted Publisher for the
    # `one2one` project (Publishing → Add a pending publisher). No API token
    # or secret is stored — OIDC below authenticates the upload, and PEP 740
    # attestations are generated and published automatically.
    environment:
      name: pypi
      url: https://pypi.org/p/one2one
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1   # pinned to a tag: required for Trusted Publishing

  docker:
    name: Build + push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io — authenticates via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deb:
    name: Build .deb + attach SBOM to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the .deb + SBOM assets to the GitHub Release
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          python3 -m pip install --break-system-packages packaging
      - name: Build .deb from the sdist
        run: |
          sdist=$(ls dist/one2one-*.tar.gz)
          fpm -s python -t deb \
            --python-bin python3 \
            --python-pip "$(command -v pip3)" \
            --python-package-name-prefix python3 \
            --depends python3 \
            --maintainer "nareinnprs-create <nareinnprs-create@users.noreply.github.com>" \
            --license MIT \
            --description "One2One — all-in-one ethical-hacking console for security researchers and pentesters" \
            --url "https://github.com/nareinnprs-create/one2one" \
            "$sdist"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            *.deb
            sbom/one2one.cdx.json
